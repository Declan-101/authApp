<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AuthApp</title>
</head>
<body>

    <h1>Login</h1>
    <p id="login-error" role="alert" hidden>Invalid username or password. Please try again.</p>
    <script>
        if (new URLSearchParams(window.location.search).get("info") === "invalid") {
            document.getElementById("login-error").hidden = false;
        }
    </script>

    <form action="/login" method="POST">

        <label for="username">Username:</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <br><br>

        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">Login</button>

    </form>

</body>
</html>
